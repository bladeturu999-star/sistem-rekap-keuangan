plugins {
    id 'com.android.application'
}

// Konfigurasi penandatanganan release WAJIB memakai keystore eksternal produksi
// melalui keystore.properties (TIDAK ada fallback debug). Ini memastikan setiap
// versi didukung signature yang sama sehingga update APK berikutnya tetap diterima.
def propsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasKeystore = propsFile.exists()
if (hasKeystore) {
    propsFile.withInputStream { keystoreProps.load(it) }
}

// Tanpa keystore produksi, build release sengaja GAGAL agar tidak menghasilkan
// APK yang ditandatangani debug secara tidak sadar.
def releaseStoreFile = hasKeystore ? keystoreProps['storeFile'] : null
def releaseStorePass = hasKeystore ? keystoreProps['storePassword'] : null
def releaseKeyAlias = hasKeystore ? keystoreProps['keyAlias'] : null
def releaseKeyPass = hasKeystore ? keystoreProps['keyPassword'] : null
if (![releaseStoreFile, releaseStorePass, releaseKeyAlias, releaseKeyPass].every { it }) {
    throw new GradleException(
        "Keystore produksi tidak ditemukan. Buat android/keystore.properties dengan " +
        "storeFile, storePassword, keyAlias, keyPassword menunjuk ke keystore eksternal " +
        "produksi. APK release tidak akan dibangun tanpa signing produksi."
    )
}

android {
    namespace 'com.fsa.rekapkeuangan'
    compileSdk 34

    lint {
        // Java 25 (Temurin) tidak kompatibel dengan lint AGP 8.x dan menyebabkan
        // lintVital crash ("25.0.4.1"). Build release tetap jalan tanpa lint vital.
        checkReleaseBuilds = false
    }

    defaultConfig {
        applicationId "com.fsa.rekapkeuangan"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile rootProject.file(releaseStoreFile)
            storePassword releaseStorePass
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.12.0'
}
